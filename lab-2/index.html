<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 2 — Responsive Navbar and Grid Drill</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- NAVBAR: Logo Left, Links Center, Cart Right (<768px Collapses) -->
  <nav class="navbar navbar-expand-md navbar-light bg-white border-bottom">
    <div class="container-fluid">
      
      <!-- 1. Logo Left -->
      <a class="navbar-brand fw-bold" href="#">StoreBrand</a>

      <!-- 2. Cart Icon (Visible on small screens before toggler) -->
      <div class="d-flex align-items-center order-md-3">
        <a href="#" class="btn btn-outline-dark position-relative me-2">
          🛒 <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">3</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
          <span class="navbar-toggler-icon"></span>
        </button>
      </div>

      <!-- 3. Links Center -->
      <div class="collapse navbar-collapse justify-content-center order-md-2" id="navMenu">
        <div class="navbar-nav">
          <a class="nav-link active" href="#">Home</a>
          <a class="nav-link" href="#">Shop</a>
          <a class="nav-link" href="#">Categories</a>
          <a class="nav-link" href="#">Deals</a>
        </div>
      </div>

    </div>
  </nav>

  <!-- PRODUCT GRID: 4-col Desktop / 2-col Tablet / 1-col Phone -->
  <main class="container py-4">
    <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-4">
      
      <!-- Card 1 -->
      <div class="col">
        <div class="card h-100">
          <img src="p1.jpg" class="card-img-top" alt="Product 1">
          <div class="card-body d-flex flex-column justify-content-between">
            <div>
              <h5 class="card-title">Product 1</h5>
              <p class="card-text text-muted">$99.99</p>
            </div>
            <button class="btn btn-primary w-100 mt-2">Add to Cart</button>
          </div>
        </div>
      </div>

      <!-- Card 2 -->
      <div class="col">
        <div class="card h-100">
          <img src="p2.jpg" class="card-img-top" alt="Product 2">
          <div class="card-body d-flex flex-column justify-content-between">
            <div>
              <h5 class="card-title">Product 2</h5>
              <p class="card-text text-muted">$149.99</p>
            </div>
            <button class="btn btn-primary w-100 mt-2">Add to Cart</button>
          </div>
        </div>
      </div>

      <!-- Card 3 -->
      <div class="col">
        <div class="card h-100">
          <img src="p3.jpg" class="card-img-top" alt="Product 3">
          <div class="card-body d-flex flex-column justify-content-between">
            <div>
              <h5 class="card-title">Product 3</h5>
              <p class="card-text text-muted">$49.99</p>
            </div>
            <button class="btn btn-primary w-100 mt-2">Add to Cart</button>
          </div>
        </div>
      </div>

      <!-- Card 4 -->
      <div class="col">
        <div class="card h-100">
          <img src="p4.jpg" class="card-img-top" alt="Product 4">
          <div class="card-body d-flex flex-column justify-content-between">
            <div>
              <h5 class="card-title">Product 4</h5>
              <p class="card-text text-muted">$79.99</p>
            </div>
            <button class="btn btn-primary w-100 mt-2">Add to Cart</button>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- Bootstrap JS (Handles menu toggle automatically) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
