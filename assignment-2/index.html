<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopFast - Home</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header / Navbar -->
  <nav class="navbar navbar-expand-md navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">ShopFast</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav mx-auto">
          <li class="nav-item"><a class="nav-link active" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Shop</a></li>
          <li class="nav-item"><a class="nav-link" href="#">About</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
        </ul>
        <a href="#" class="text-white text-decoration-none">🛒 Cart (0)</a>
      </div>
    </div>
  </nav>

 
  <main class="container my-4">
    <h1 class="mb-4">Our Products</h1>
    <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-4">

      <div class="col">
        <div class="card h-100">
          <img src="p1.jpg" class="card-img-top" alt="Product 1">
          <div class="card-body">
            <h5 class="card-title"><a href="product.html">Product 1</a></h5>
            <p class="card-text">$9.99</p>
            <button class="btn btn-primary">Add to Cart</button>
          </div>
        </div>
      </div>

      <div class="col">
        <div class="card h-100">
          <img src="p2.jpg" class="card-img-top" alt="Product 2">
          <div class="card-body">
            <h5 class="card-title"><a href="product.html">Product 2</a></h5>
            <p class="card-text">$24.99</p>
            <button class="btn btn-primary">Add to Cart</button>
          </div>
        </div>
      </div>

      <div class="col">
        <div class="card h-100">
          <img src="p3.jpg" class="card-img-top" alt="Product 3">
          <div class="card-body">
            <h5 class="card-title"><a href="product.html">Product 3</a></h5>
            <p class="card-text">$14.99</p>
            <button class="btn btn-primary">Add to Cart</button>
          </div>
        </div>
      </div>

      <div class="col">
        <div class="card h-100">
          <img src="p4.jpg" class="card-img-top" alt="Product 4">
          <div class="card-body">
            <h5 class="card-title"><a href="product.html">Product 4</a></h5>
            <p class="card-text">$39.99</p>
            <button class="btn btn-primary">Add to Cart</button>
          </div>
        </div>
      </div>


    </div>

  <footer class="bg-dark text-white text-center py-3 mt-5">
    <p class="mb-0">&copy; 2026 ShopFast. All rights reserved.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</html>
